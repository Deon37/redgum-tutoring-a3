{% extends 'base.html' %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="section-header">
    <div>
        <h1>Edit Student</h1>
        <p>Update the student's details.</p>
    </div>
    <a href="{{ url_for('students') }}" class="btn btn-secondary">Back to Students</a>
</div>

<form class="form" method="POST" action="{{ url_for('student_detail', student_id=student['id']) }}">
    <div class="form-group">
        <label for="name">Student Name</label>
        <input type="text" id="name" name="name" value="{{ request.form.get('name', '') if request.method == 'POST' else student['name'] }}" required>
    </div>
    <div class="form-group">
        <label for="year_level">Year Level</label>
        <input type="number" id="year_level" name="year_level" min="1" max="12" value="{{ request.form.get('year_level', '') if request.method == 'POST' else student['year_level'] }}" required>
    </div>
    <div class="form-group">
        <label for="contact_name">Parent / Guardian Name</label>
        <input type="text" id="contact_name" name="contact_name" value="{{ request.form.get('contact_name', '') if request.method == 'POST' else student['contact_name'] }}" required>
    </div>
    <div class="form-group">
        <label for="contact_phone">Contact Phone</label>
        <input type="text" id="contact_phone" name="contact_phone" value="{{ request.form.get('contact_phone', '') if request.method == 'POST' else student['contact_phone'] }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
