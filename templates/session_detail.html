{% extends 'base.html' %}

{% block title %}Edit Session{% endblock %}

{% block content %}
<div class="section-header">
    <div>
        <h1>Edit Session</h1>
        <p>{{ session['student_name'] }} with {{ session['tutor_name'] }}</p>
    </div>
    <a href="{{ url_for('sessions') }}" class="btn btn-secondary">Back to Sessions</a>
</div>

<form class="form" method="POST" action="{{ url_for('session_detail', session_id=session['id']) }}">
    <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ request.form.get('date', '') if request.method == 'POST' else session['date'] }}" required>
    </div>
    <div class="form-group">
        <label for="start_time">Start Time</label>
        <input type="time" id="start_time" name="start_time" value="{{ request.form.get('start_time', '') if request.method == 'POST' else session['start_time'] }}" required>
    </div>
    <div class="form-group">
        <label for="length_mins">Length</label>
        <select id="length_mins" name="length_mins" required>
            <option value="60" {% if (request.form.get('length_mins') or session['length_mins']|string) == '60' %}selected{% endif %}>60 minutes</option>
            <option value="90" {% if (request.form.get('length_mins') or session['length_mins']|string) == '90' %}selected{% endif %}>90 minutes</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
